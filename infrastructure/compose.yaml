# OpenMic production stack.  Usage (from this folder):
#   ./scripts/setup.sh            # writes .env with generated secrets
#   docker compose up -d --build
name: openmic

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openmic
      POSTGRES_USER: openmic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmic -d openmic"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../services/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://openmic:${POSTGRES_PASSWORD}@postgres:5432/openmic
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in infrastructure/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in infrastructure/.env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_REGION_CODE: ${YOUTUBE_REGION_CODE:-}
      YOUTUBE_DAILY_SEARCH_BUDGET: ${YOUTUBE_DAILY_SEARCH_BUDGET:-90}
      DEFAULT_PARTY_TITLE: ${DEFAULT_PARTY_TITLE:-Karaoke Night}
      LOG_JSON: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  caddy:
    build:
      context: ..
      dockerfile: infrastructure/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # Nightly compressed database dumps into ./backups (kept for BACKUP_KEEP_DAYS).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: openmic
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: openmic
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/openmic-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump --no-owner --clean --if-exists | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file" && echo "backup written: $$file"
          else
            rm -f "$$file.tmp"; echo "backup FAILED" >&2
          fi
          find /backups -name 'openmic-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
