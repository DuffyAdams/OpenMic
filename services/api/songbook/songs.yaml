# OpenMic songbook: songs guests can browse and add without searching.
#
# After editing, run `make songbook` to find karaoke videos for new songs (no API key or quota
# needed). The result is app/songbook.json, which the server loads at startup.
#
# Each song is written "Title - Artist" and may appear in several categories. Category order and
# song order here are the order guests see. Long form for overrides:
#   - {song: "Shallow - Lady Gaga & Bradley Cooper", videos: [VIDEO_ID, VIDEO_ID]}  # hand-picked
#   - {song: "Golden - HUNTR/X", search: "golden kpop demon hunters karaoke"}       # custom search

